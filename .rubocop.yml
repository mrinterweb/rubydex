inherit_gem:
  rubocop-shopify: rubocop.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - "src/**/*"
    - "target/**/*"
    - "tmp/**/*"
    # Test fixtures are Ruby written to exercise the indexer, not shipped code; their style is
    # irrelevant and sometimes deliberately unusual.
    - "rust/rubydex/tests/fixtures/**/*"

Style/GlobalVars:
  Exclude:
    - ext/rubydex/extconf.rb
