[package]
name = "rubydex-index-manager"
version.workspace = true
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "Machine-wide file-system event manager that keeps disk-index stores fresh."
categories = ["development-tools"]

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = { version = "9.0.0-rc.5" }

[dev-dependencies]
tempfile = "3.0"

[lints]
workspace = true
