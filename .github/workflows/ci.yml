name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ffi-allocator-invariants:
    # Debug jemalloc turns sized-deallocation mismatches and double frees into hard failures
    # instead of the heap corruption glibc silently tolerates (see commit 8f9359b).
    runs-on: ubuntu-latest
    name: FFI allocator invariants (debug jemalloc)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compile with debug jemalloc
        run: RUBYDEX_JEMALLOC_DEBUG=1 bundle exec rake compile

      - name: Ruby suite
        run: bundle exec rake ruby_test

  no-store-feature:
    # Proves the default (no redb-store) build is behavior-identical: the disk layer must be
    # entirely absent, not merely unused.
    runs-on: ubuntu-latest
    name: Default build without redb-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compile without the feature
        run: RUBYDEX_NO_REDB_STORE=1 bundle exec rake compile

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml -p rubydex -p rubydex-sys

      - name: Ruby suite
        run: RUBYDEX_NO_REDB_STORE=1 bundle exec rake ruby_test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Install Rust tools
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add --toolchain stable clippy rustfmt

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          bundler-cache: true

      - name: Lint
        run: bundle exec rake lint

      - name: Compile
        run: bundle exec rake compile

      - name: Check generated rules are up to date
        run: |
          changes=$(git status --porcelain lib/rubydex/rules)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Generated rule classes are stale. Run \`bundle exec rake generate_rules\` and commit the result."
            exit 1
          fi

      - name: Run Rubydex linter
        run: bundle exec rdx lint

      # Verify that licenses conform to the policy in rust/about.toml
      - name: Check licenses
        run: |
          cargo install cargo-about --features cli
          cargo about generate rust/about_templates --name about --manifest-path rust/Cargo.toml --workspace > THIRD_PARTY_LICENSES.html
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Restore Rust compile cache
        id: rust-compile-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-rust

      - name: Run Rust tests
        run: bundle exec rake cargo_test

      - name: Run Ruby tests
        run: bundle exec rake test

      # The store builder spawns (rather than forks) since 31527f6, so the disk index is expected to
      # work on Windows; run the disk tests there instead of assuming it cannot.
      - name: Disk-index tests
        if: runner.os == 'windows'
        run: bundle exec ruby -Itest test/disk_index_live_edit_test.rb

      - name: Save Rust compile cache
        id: rust-compile-cache-save
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ steps.rust-compile-cache-restore.outputs.cache-primary-key }}
